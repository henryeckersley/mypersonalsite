name: Render The History of Nothing Audiobook Master
on:
  push:
    branches:
      - the-history-of-nothing-master-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout isolated audiobook branch
        uses: actions/checkout@v4
      - name: Setup python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sound production tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install -U pip
          python -m pip install edge-tts==7.3.1 pydub==0.25.1
          ffprobe -version | head -1
      - name: Render complete six-movement documentary audiobook
        working-directory: audiobook-production
        env:
          VOICE: en-US-AndrewMultilingualNeural
          RATE: "-7%"
        run: python -u render_no_floor.py
      - name: Preserve all output and error diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: The-History-of-Nothing-Complete-Neural-Master
          path: |
            audiobook-production/out/The_History_of_Nothing_Clean_Narration.mp3
            audiobook-production/out/manifest.json
            audiobook-production/out/parts/*.mp3
          if-no-files-found: warn
          retention-days: 7
