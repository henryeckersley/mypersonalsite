name: Render The Longest Minute alternate neural voice
on:
  push:
    branches:
      - audiobook-longest-minute-andrew-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audiobook:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup narration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install -U pip
          python -m pip install "edge-tts>=7.0" "pydub>=0.25"
          ffmpeg -version | head -1
      - name: Render and verify all nine chapters
        working-directory: audiobook-production
        run: python -u render.py
        env:
          VOICE: en-US-AndrewMultilingualNeural
      - name: Save audiobook audio and chapter metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: The-Longest-Minute-Andrew-Neural
          path: |
            audiobook-production/rendered/The_Last_Edition_Neural_Narration.mp3
            audiobook-production/rendered/chapters.json
            audiobook-production/rendered/chapters/*.mp3
          retention-days: 7
          if-no-files-found: warn
