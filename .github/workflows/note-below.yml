name: Render The Part I Sold voice stems
on:
  push:
    branches:
      - the-part-i-sold-audiobook-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audiobook:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout novel studio branch
        uses: actions/checkout@v4
      - name: Set up narrator environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio and neural speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install -U pip
          python -m pip install "edge-tts==7.3.1" "pydub==0.25.1"
          ffprobe -version | head -1
      - name: Synthesize and verify every narration passage
        working-directory: audiobook-production
        env:
          RAY_VOICE: en-US-AndrewMultilingualNeural
          DINA_VOICE: en-US-AvaMultilingualNeural
          RATE: "-5%"
        run: python -u synthesize_note_below.py
      - name: Save every source clip and exact assembly manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: The-Part-I-Sold-Voice-Stems
          path: |
            audiobook-production/speech/*.mp3
            audiobook-production/speech/manifest.json
          retention-days: 7
          if-no-files-found: warn
